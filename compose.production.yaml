name: bienvendre-prod
services:
  web:
    build: .
    init: true
    restart: unless-stopped
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PORT: '3000'
      SEED_DEMO: 'false'
      COOKIE_SECURE: 'true'
      TRUST_PROXY: '1'
      PUBLIC_URL: https://${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
    volumes:
      - florist_uploads:/app/.local/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: florist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: bien_vendre
    volumes:
      - florist_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U florist -d bien_vendre']
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.production}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  florist_db:
  florist_uploads:
  caddy_data:
  caddy_config:
