services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: florist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: bien_vendre
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - florist_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florist -d bien_vendre"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  florist_db:
