services:
  web:
    build: .
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-florist_secret_2026}
      PORT: "3000"
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminBienVendre123!}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-OwnerBienVendre123!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORE_WHATSAPP: ${STORE_WHATSAPP:-}
      STORE_INSTAGRAM: ${STORE_INSTAGRAM:-}
      STORE_ADDRESS: ${STORE_ADDRESS:-Pekanbaru, Riau}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: florist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-florist_secret_2026}
      POSTGRES_DB: bien_vendre
    ports:
      - "5432:5432"
    volumes:
      - florist_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florist -d bien_vendre"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  florist_db:
